<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="haloRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBB7DC" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#D9CCE6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#BCA5D1" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4A2374" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background elliptical halo ring -->
  <ellipse cx="250" cy="85" rx="230" ry="46" fill="none" stroke="url(#haloRing)" stroke-width="12" transform="rotate(-3 250 85)" />

  <!-- Elegant Script 'Halo' -->
  <text x="250" y="105" text-anchor="middle" font-family="'Playfair Display', 'Cormorant Garamond', 'Brush Script MT', 'Great Vibes', cursive, serif" font-style="italic" font-weight="700" font-size="115" fill="#4B2375" filter="url(#subtleGlow)" letter-spacing="1">Halo</text>

  <!-- Clean Subtitle 'HAIR DESIGN' -->
  <text x="250" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="21" fill="#24143D" letter-spacing="9">HAIR DESIGN</text>
  <text x="250" y="176" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="500" font-size="11" fill="#706E6B" letter-spacing="5">OTLEY • WEST YORKSHIRE</text>
</svg>
